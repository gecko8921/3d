<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floor 2 - 360 view</title>
</head>
<body>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
  html,body{margin:0;height:100%}
  #wrap{position:relative;width:100%;height:100%}
  #pano{width:100%;height:100%}
  #hint{position:absolute;left:32px;bottom:32px;display:flex;align-items:center;gap:12px;
    padding:12px 18px 12px 14px;border-radius:999px;background:rgba(44,72,62,.82);color:#fff;
    font:500 14px/1 'DM Sans',Arial,sans-serif;letter-spacing:.02em;pointer-events:none;
    transition:opacity .6s ease;z-index:5}
  #hint svg{width:28px;height:28px;animation:swipe 1.8s ease-in-out infinite}
  #hint.hide{opacity:0}
  @keyframes swipe{0%,100%{transform:translateX(-6px) rotate(-8deg)}50%{transform:translateX(6px) rotate(8deg)}}
</style>
<div id="wrap">
  <div id="pano"></div>
  <div id="hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"/>
      <path d="M12 10V9a1.5 1.5 0 0 1 3 0v2"/>
      <path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.6-2.2L4 15.5a1.5 1.5 0 0 1 2.3-1.9L9 16V11"/>
    </svg>
    Drag to look around
  </div>
</div>
<script>
var viewer = pannellum.viewer('pano', {
  type: 'equirectangular',
  panorama: 'floor-2-360.jpg',
  autoLoad: true,
  yaw: 85, pitch: -3, hfov: 100,
  showZoomCtrl: false, mouseZoom: false, keyboardZoom: false, compass: false
});
viewer.on('load', function () {
  setTimeout(function () { viewer.lookAt(-5, 0, 100, 9000); }, 2000);
});
function hideHint(){ document.getElementById('hint').classList.add('hide'); }
['mousedown','touchstart','pointerdown'].forEach(function(e){
  document.getElementById('pano').addEventListener(e, hideHint, {once:true});
});
</script>
</body>
</html>
